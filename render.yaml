services:
  - type: web
    name: scruppy
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: false
    healthCheckPath: /health
    disk:
      name: scruppy-state
      mountPath: /app/state
      sizeGB: 1
    envVars:
      - key: IGBOT_COOKIE
        sync: false
      - key: IGBOT_CONTROL_TOKEN
        sync: false
      - key: IGBOT_AUTOSTART
        value: "true"
      - key: IGBOT_POLL_SECONDS
        value: "60"
      - key: IGBOT_LOG_LEVEL
        value: INFO
      - key: IGBOT_PROFILE_DIR
        value: /app/state/profile
      - key: IGBOT_LOG_FILE
        value: /app/state/igbot.log
